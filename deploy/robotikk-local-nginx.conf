# Lokal nginx-instans på webserveren selv (192.168.30.105).
# Server kun statiske Hugo-filer på LAN; auth/TLS håndteres av edge-nginx på Proxmox-verten.
server {
    listen 8080;
    server_name _;

    root /opt/robotikk-site/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
