# Lokal nginx-instans på webserveren selv (192.168.30.105).
# Cloudflare Tunnel (cloudflared, kjører på samme maskin) peker hostnames hit.
# Katalogen er offentlig, mens hovedsiden fortsatt krever Basic Auth.
server {
    listen 8080 default_server;
    server_name robotikk.org;

    auth_basic "robotikk.org";
    auth_basic_user_file /etc/nginx/robotikk.htpasswd;

    root /opt/robotikk-site/public;
    index index.html;

    location ^~ /css/ {
        auth_basic off;
        try_files $uri =404;
    }

    location ^~ /js/ {
        auth_basic off;
        try_files $uri =404;
    }

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /logg-inn/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /aktiver/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /glemt-passord/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080;
    server_name catalog.robotikk.org;

    root /opt/robotikk-site/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
