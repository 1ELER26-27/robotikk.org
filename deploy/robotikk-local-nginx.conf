# Lokal nginx-instans på webserveren selv (192.168.30.105).
# Cloudflare Tunnel (cloudflared, kjører på samme maskin) peker robotikk.org hit.
# Basic Auth gjøres her siden ingen egen edge-nginx lenger er involvert.
server {
    listen 8080;
    server_name _;

    auth_basic "robotikk.org";
    auth_basic_user_file /etc/nginx/robotikk.htpasswd;

    root /opt/robotikk-site/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
