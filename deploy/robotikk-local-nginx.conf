# Lokal nginx-instans på webserveren selv (192.168.30.105).
# Cloudflare Tunnel (cloudflared, kjører på samme maskin) peker hostnames hit.
# Katalogen på robotikk.org krever individuell pålogging (nginx spør backend via
# auth_request); catalog.robotikk.org forblir helt offentlig og uten pålogging.
server {
    listen 8080 default_server;
    server_name robotikk.org;

    root /opt/robotikk-site/public;
    index index.html;

    # Kun nåbar internt fra nginx (auth_request), aldri direkte fra klienten.
    location = /internal/auth-check {
        internal;
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location ^~ /css/ {
        try_files $uri =404;
    }

    location ^~ /js/ {
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /logg-inn/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /aktiver/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /glemt-passord/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location ^~ /min-side/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location / {
        auth_request /internal/auth-check;
        error_page 401 = @need_login;
        try_files $uri $uri/ =404;
    }

    location @need_login {
        return 302 /logg-inn/;
    }
}

server {
    listen 8080;
    server_name catalog.robotikk.org;

    root /opt/robotikk-site/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
