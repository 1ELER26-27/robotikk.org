# REFERANSE-KONFIG for den ANDRE nginx-maskinen på Proxmox-verten
# (ikke webserveren robotikk.org kjører på — kopier dette dit, kjør IKKE her).
#
# Forutsetter:
#   - htpasswd-fil opprettet: htpasswd -c -B /etc/nginx/robotikk.htpasswd <brukernavn>
#   - Cloudflare Tunnel (cloudflared) satt opp på samme maskin, se plan Fase 1.

server {
    listen 80;
    server_name robotikk.org www.robotikk.org;

    auth_basic "robotikk.org";
    auth_basic_user_file /etc/nginx/robotikk.htpasswd;

    location / {
        proxy_pass http://192.168.30.105:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name deploy.robotikk.org;

    # Ingen basic auth her: GitHub sin HMAC-signatur (webhook secret) beskytter dette endepunktet.
    location / {
        proxy_pass http://192.168.30.105:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
